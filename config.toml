# tunx 配置文件
#
# 运行模式：server 或 client
# 根据实际需求修改此行，然后填写对应 section 的参数
mode = "server"

# ═══════════════════════════════════════════════════════════════════════════════
# 服务端配置（mode = "server" 时生效）
# ═══════════════════════════════════════════════════════════════════════════════

[server]

# 监听地址
# - QUIC 模式走 UDP，TCP/WebSocket/XHTTP 模式走 TCP，可在同一端口共存
bind_addr = "0.0.0.0:7000"

# 传输模式（默认 quic）：
#
#   quic            仅 QUIC（UDP），性能最佳，但不支持 CDN 代理
#   tcp             仅 TCP+TLS+HTTP/2，CDN 友好
#   websocket       仅 WebSocket（TCP+TLS+WS），CDN 友好，伪装为普通 WS 流量
#   xhttp           仅 XHTTP（TCP+TLS+HTTP/2），与 tcp 实现相同，专为 CDN 设计
#
#   quic+tcp        QUIC + TCP 同时监听同一端口（UDP/TCP 不冲突）
#   quic+websocket  QUIC + WebSocket 同时监听同一端口
#   quic+xhttp      QUIC + XHTTP 同时监听同一端口
#
# 注意：tcp/websocket/xhttp 及其组合模式要求 TLS 为 acme 或 manual（不支持 self_signed）
transport = "quic"

# 允许客户端使用的公网端口范围
proxy_port_range = [10000, 20000]

# 认证 token（客户端必须携带相同 token，留空不校验）
token = "your-secret-token"

# 心跳超时（秒），超时断开客户端
heartbeat_timeout_secs = 90

# 日志等级：error / warn / info / debug / trace
# 也支持细粒度：tunx=debug,quinn=warn
log_level = "info"

# WebSocket 路径（仅 websocket / quic+websocket 模式生效）
# 客户端连接时使用的 HTTP 路径，两端必须一致
ws_path = "/tunx-ws"

# QUIC 传输层调优（仅 quic / quic+* 模式生效）
[server.quic]
congestion = "new_reno"      # new_reno（稳定）或 bbr（高吞吐，实验性）
initial_mtu = 1200            # 初始 MTU，quinn 会自动探测上调
recv_window = 8388608         # 接收窗口（8 MiB），建议 2-4 倍 BDP

# TLS 证书配置（必填，三种模式选一种）

# ---------- 模式一：Let's Encrypt 自动申请（Cloudflare DNS-01）----------
# 不需要 80 端口，域名无需解析到本机
[server.tls]
mode = "acme"
domain = "tunx.example.com"
email = "admin@example.com"
cf_api_token = "your-cloudflare-api-token"  # 需要 Zone:DNS:Edit + Zone:Zone:Read
cache_dir = "./acme-cache"
staging = false               # 测试时设为 true（不消耗配额）

# ---------- 模式二：手动证书 ----------
# 适用于已有 CA 签发证书的场景（如 ZeroSSL、阿里云等）
# [server.tls]
# mode = "manual"
# cert_file = "/etc/tunx/cert.pem"
# key_file = "/etc/tunx/key.pem"

# ---------- 模式三：自签名证书（仅 transport=quic 可用）----------
# 适用于无域名的快速部署，客户端需设 tls_skip_verify = true
# [server.tls]
# mode = "self_signed"
# sni = "www.bing.com"         # 伪装域名


# ═══════════════════════════════════════════════════════════════════════════════
# 客户端配置（mode = "client" 时生效）
# 使用客户端时，将 mode 改为 "client" 并填写以下参数
# ═══════════════════════════════════════════════════════════════════════════════

# [client]

# 服务端地址（IP:端口 或 域名:端口）
# server_addr = "tunx.example.com:7000"

# 传输模式（默认 quic），必须与服务端匹配：
#   quic        QUIC（UDP），性能最佳
#   tcp         TCP+TLS+HTTP/2，CDN 友好
#   websocket   WebSocket，CDN 友好
#   xhttp       XHTTP/HTTP/2，CDN 友好
# transport = "quic"

# 认证 token（与服务端一致）
# token = "your-secret-token"

# 是否跳过 TLS 证书校验（自签名证书时设为 true）
# tls_skip_verify = false

# TLS SNI 域名（可选，不填则从 server_addr 提取 hostname）
# tls_sni = "tunx.example.com"

# 心跳间隔（秒）
# heartbeat_interval_secs = 30

# 断线重连最大间隔（秒，指数退避）
# reconnect_max_secs = 60

# 日志等级
# log_level = "info"

# WebSocket 路径（仅 websocket 模式生效，必须与服务端一致）
# ws_path = "/tunx-ws"

# QUIC 传输层调优
# [client.quic]
# congestion = "new_reno"
# initial_mtu = 1200
# recv_window = 8388608

# ─── 代理列表 ───────────────────────────────────────────────────────────────────
# 每个 [[client.proxies]] 定义一条穿透规则
# type 可选 tcp / udp，remote_port = 0 则随机分配

# TCP 代理示例：本地 SSH → 服务端 10022
# [[client.proxies]]
# name = "ssh"
# type = "tcp"
# local_addr = "127.0.0.1:22"
# remote_port = 10022

# TCP 代理 + TLS 终止（仅服务端有正规 CA 证书时可用）
# 启用后该端口只能 HTTPS 访问，明文 HTTP 会被 301 跳转到 HTTPS
# [[client.proxies]]
# name = "web"
# type = "tcp"
# local_addr = "127.0.0.1:5244"
# remote_port = 10443
# tls = true
# custom_domain = "web.example.com"   # 必须与服务端证书 SAN 匹配

# UDP 代理示例：本地 DNS → 服务端 10053
# [[client.proxies]]
# name = "dns"
# type = "udp"
# local_addr = "127.0.0.1:53"
# remote_port = 10053

# ═══════════════════════════════════════════════════════════════════════════════
# Web 管理界面（server / client 模式下都生效）
# ═══════════════════════════════════════════════════════════════════════════════
#
# 提供一个网页界面用于：查看运行状态、连接情况、流量统计；在线编辑配置并热更新
# （无需重启进程，保存后自动应用新配置）
#
# 首次启动时，如果 password_hash 为空，会自动生成一个随机密码，
# 写回本文件并打印在启动日志中（仅打印这一次，请妥善保存）

[web]

# 是否启用 Web UI，默认 true
enabled = true

# 监听地址，默认 "0.0.0.0:1080"
listen = "0.0.0.0:1080"

# 登录用户名，默认 "admin"
username = "admin"

# 登录密码的 argon2 哈希值，留空则首次启动自动生成随机密码
password_hash = ""
