name: build and release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true
        type: string
        default: v0.1.0

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.80.0"

jobs:
  build:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: target/
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('**/*.rs') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}-
            ${{ runner.os }}-cargo-build-

      - name: Install protoc
        run: |
          sudo apt-get update -q
          sudo apt-get install -y protobuf-compiler

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web-ui/package-lock.json

      - name: Build Web UI
        run: |
          cd web-ui
          npm ci
          npm run build

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build (debug)
        run: cargo build --all

      - name: Run tests
        run: cargo test --all

  # ─── Release 交叉编译 ────────────────────────────────────────────────────────
  release:
    name: Release Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: x86_64
          - target: aarch64-unknown-linux-musl
            arch: aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Install protoc
        run: |
          sudo apt-get update -q
          sudo apt-get install -y protobuf-compiler

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web-ui/package-lock.json

      - name: Build Web UI
        run: |
          cd web-ui
          npm ci
          npm run build

      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build release (cross / musl)
        run: |
          cross build --release \
            --target ${{ matrix.target }} \
            --bin tunx

      - name: Package
        run: |
          mkdir -p pkg
          cp target/${{ matrix.target }}/release/tunx pkg/tunx
          cp config.toml pkg/config.toml
          tar -czf tunx-linux-${{ matrix.arch }}.tar.gz -C pkg .
          echo "=== package ===" && tar -tzf tunx-linux-${{ matrix.arch }}.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tunx-linux-${{ matrix.arch }}
          path: tunx-linux-${{ matrix.arch }}.tar.gz
          retention-days: 1

  # ─── 发布 GitHub Release ────────────────────────────────────────────────────
  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: List artifacts
        run: ls -lh artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: "tunx ${{ inputs.tag || github.ref_name }}"
          body: |
            ## 下载

            | 平台 | 文件 |
            |------|------|
            | Linux x86_64 | `tunx-linux-x86_64.tar.gz` |
            | Linux aarch64 | `tunx-linux-aarch64.tar.gz` |

            ## 压缩包内容

            每个压缩包包含二进制文件 `tunx` 和 `config.toml` 配置文件。

            ## 快速使用

            ```bash
            # 解压
            tar -xzf tunx-linux-x86_64.tar.gz

            # 编辑配置：在 config.toml 顶部设置 mode = "server" 或 mode = "client"
            vi config.toml

            # 启动
            ./tunx -c config.toml
            ```
          files: artifacts/*.tar.gz
          draft: false
          prerelease: false
