[workspace]
members = [
    "crates/tunx-proto",
    "crates/tunx-common",
    "crates/tunx",
]
resolver = "2"

[workspace.dependencies]
tonic               = { version = "0.10", features = ["transport", "tls", "tls-roots"] }
prost               = "0.12"
quinn               = "0.10"
rustls              = { version = "=0.21.10", features = ["dangerous_configuration"] }
rustls-pemfile      = "1"
rustls-native-certs = "0.6"
rcgen               = "0.11"
tokio               = { version = "1", features = ["full"] }
tokio-stream        = { version = "0.1", features = ["sync"] }
ring                = "0.17"
uuid                = { version = "=1.11.0", features = ["v4"] }
anyhow              = "1"
thiserror           = "1"
tracing             = "0.1"
tracing-subscriber  = { version = "0.3", features = ["env-filter"] }
serde               = { version = "1", features = ["derive"] }
toml                = "0.5"
clap                = { version = "=4.4.18", features = ["derive"] }
dashmap             = "5"
base64              = "0.21"
async-stream        = "0.3"
futures             = "0.3"
tower               = "0.4"
hyper               = { version = "0.14", features = ["client", "http1", "http2"] }
serde_json          = "1"
bytes               = "1"
tokio-tungstenite   = { version = "0.20", default-features = false, features = ["handshake"] }

# ── 传递依赖 pin（兼容 Rust 1.75）────────────────
rand                = "=0.8.5"
getrandom           = "=0.2.15"
hashbrown           = "=0.14.5"
indexmap            = "=2.2.6"
time                = "=0.3.35"
idna_adapter        = "=1.1.0"

[profile.release]
strip         = "symbols"
debug         = false
opt-level     = 3
lto           = true
codegen-units = 1
